name: Feature request
description: Propose a product or engineering improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user or operator problem exists today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful improvement.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note other approaches or why this should exist at all.
  - type: textarea
    id: risks
    attributes:
      label: Risks and rollout notes
      description: Call out migration, compatibility, security, or UX concerns.
