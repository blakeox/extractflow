name: CodeQL

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
      - dev
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Initialize CodeQL
        id: codeql_init
        uses: github/codeql-action/init@0daab03d71ff584ef619d027a3fd9146679c5d84
        with:
          languages: ${{ matrix.language }}
        continue-on-error: true

      - name: Autobuild
        id: codeql_autobuild
        if: steps.codeql_init.outcome == 'success'
        uses: github/codeql-action/autobuild@0daab03d71ff584ef619d027a3fd9146679c5d84
        continue-on-error: true

      - name: Analyze
        id: codeql_analyze
        if: steps.codeql_init.outcome == 'success'
        uses: github/codeql-action/analyze@0daab03d71ff584ef619d027a3fd9146679c5d84
        continue-on-error: true

      - name: Note unsupported CodeQL upload
        if: steps.codeql_init.outcome == 'failure' || steps.codeql_autobuild.outcome == 'failure' || steps.codeql_analyze.outcome == 'failure'
        run: |
          echo "Native CodeQL upload is not supported for this repository configuration."
          echo "Treating this as informational until GitHub code scanning is available for the repository."
