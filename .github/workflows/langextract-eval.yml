name: LangExtract Eval

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "evals/langextract/**"
      - "worker/app/services/langextract_eval.py"
      - "worker/app/services/executor.py"
      - "worker/app/services/provider.py"
      - "shared/extraction_core/**"
      - "scripts/evaluate-langextract.py"
      - ".github/workflows/langextract-eval.yml"
  pull_request:
    paths:
      - "evals/langextract/**"
      - "worker/app/services/langextract_eval.py"
      - "scripts/evaluate-langextract.py"
      - ".github/workflows/langextract-eval.yml"

permissions:
  contents: read

concurrency:
  group: langextract-eval-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-cases:
    name: Validate golden-set cases
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate LangExtract eval case definitions
        run: |
          PYTHONPATH=worker:shared python ./scripts/evaluate-langextract.py \
            evals/langextract/cases \
            --validate-only

  nightly-eval:
    name: Nightly LangExtract eval
    runs-on: ubuntu-latest
    # Ollama model pull + live eval are costly; skip on private repos (minute quota).
    if: |
      github.repository_visibility == 'public' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 45
    needs: validate-cases

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Wait for Ollama
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama did not become ready in time"
          exit 1

      - name: Pull CI eval model
        run: |
          curl -fsS http://127.0.0.1:11434/api/pull -d '{"name":"qwen2.5:3b"}'

      - name: Run LangExtract golden-set eval
        env:
          LANGEXTRACT_EVAL_BASE_URL: http://127.0.0.1:11434/v1
          LANGEXTRACT_EVAL_MODEL: qwen2.5:3b
        run: |
          set -o pipefail
          PYTHONPATH=worker:shared python ./scripts/evaluate-langextract.py \
            evals/langextract/cases \
            --label "ci-${{ github.run_id }}" | tee langextract-eval-summary.txt

      - name: Upload LangExtract eval summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: langextract-eval-summary
          path: langextract-eval-summary.txt
          if-no-files-found: ignore
