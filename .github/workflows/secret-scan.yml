name: Secret Scan

# Primary secret scan runs in CI (test.yml python job). This workflow remains for
# manual reruns without running the full test matrix.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run repository secret scan
        run: ./scripts/scan-secrets.py
