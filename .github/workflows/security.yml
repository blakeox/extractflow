name: Dependency Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Review dependency changes
        id: dependency_review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        continue-on-error: true

      - name: Note unsupported dependency review
        if: steps.dependency_review.outcome == 'failure'
        run: |
          echo "Native dependency review is not supported for this repository configuration."
          echo "Treating this as informational until GitHub Advanced Security support is available."
