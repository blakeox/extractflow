name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".github/CODEOWNERS"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".github/CODEOWNERS"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run shell verification
        run: ./scripts/verify-shell.sh

      - name: Run repository secret scan
        run: ./scripts/scan-secrets.py

      - name: Validate LangExtract golden-set cases
        run: |
          PYTHONPATH=worker:shared python ./scripts/evaluate-langextract.py \
            evals/langextract/cases \
            --validate-only

      - name: Run Python test suites
        run: ./scripts/verify-python.sh

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend verification
        run: ./scripts/verify-frontend.sh

      - name: Summarize frontend coverage
        if: always()
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const path = 'frontend/test-results/coverage/coverage-summary.json';
          if (!fs.existsSync(path)) {
            console.log('## Frontend coverage');
            console.log('');
            console.log('Coverage summary file was not generated.');
            process.exit(0);
          }
          const summary = JSON.parse(fs.readFileSync(path, 'utf8')).total;
          console.log('## Frontend coverage');
          console.log('');
          console.log('| Metric | Coverage | Covered / Total |');
          console.log('| --- | ---: | ---: |');
          for (const key of ['statements', 'branches', 'functions', 'lines']) {
            const metric = summary[key];
            console.log(`| ${key} | ${metric.pct.toFixed(2)}% | ${metric.covered} / ${metric.total} |`);
          }
          EOF

      - name: Summarize frontend bundle size
        if: always()
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const path = 'frontend/test-results/bundle-size.json';
          if (!fs.existsSync(path)) {
            console.log('## Frontend bundle size');
            console.log('');
            console.log('Bundle summary file was not generated.');
            process.exit(0);
          }
          const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
          console.log('## Frontend bundle size');
          console.log('');
          console.log('| Asset | Actual | Budget | Status |');
          console.log('| --- | ---: | ---: | --- |');
          for (const key of ['js', 'css']) {
            const actual = (summary.actual[key] / 1024).toFixed(2);
            const budget = (summary.budgets[key] / 1024).toFixed(2);
            const status = summary.actual[key] <= summary.budgets[key] ? 'pass' : 'fail';
            console.log(`| ${key.toUpperCase()} | ${actual} KiB | ${budget} KiB | ${status} |`);
          }
          EOF

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-coverage
          path: frontend/test-results/coverage
          if-no-files-found: ignore

      - name: Upload frontend bundle metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-bundle-metrics
          path: frontend/test-results/bundle-size.json
          if-no-files-found: ignore

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend for E2E
        run: npm run build

      - name: Run browser accessibility smoke tests
        run: npm run test:a11y

      - name: Run browser E2E
        run: npm run test:e2e -- --grep-invert @a11y

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
