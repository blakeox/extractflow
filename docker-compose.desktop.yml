services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/app.db
      DATA_DIR: /data
      UPLOADS_DIR: /data/uploads
      EXPORTS_DIR: /data/exports
      PARSED_DIR: /data/parsed
      SEED_SAMPLES_ON_STARTUP: ${SEED_SAMPLES_ON_STARTUP:-true}
      CORS_ORIGINS: '["http://127.0.0.1:1420","tauri://localhost"]'
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ${EXTRACTFLOW_APP_DATA_DIR:-./.extractflow-data}:/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/app.db
      PARSED_DIR: /data/parsed
      WORKER_POLL_SECONDS: 5
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${EXTRACTFLOW_APP_DATA_DIR:-./.extractflow-data}:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${EXTRACTFLOW_APP_DATA_DIR:-./.extractflow-ollama}:/root/.ollama
    restart: unless-stopped
